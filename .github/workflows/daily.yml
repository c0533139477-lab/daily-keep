name: Daily Keep

on:
  schedule:
    # כל בוקר בערך ב-6:15 (חורף) או 7:15 (קיץ) שעון ישראל. גיטהאב לפעמים מאחרת בכמה דקות
    - cron: '15 4 * * *'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm start
        env:
          TZ: Asia/Jerusalem
          # כל ההגדרות הסודיות של המאגר, כדי שכל שם חדש (למשל ISRACARD2_ID) יעבוד בלי לשנות את הקובץ הזה
          ALL_SECRETS: ${{ toJSON(secrets) }}
